name: Reproduce public-data analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Reproduce and check
        run: python reproduce.py
      - name: Save rebuilt outputs
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-manuscript-and-results
          path: |
            manuscript/Job_seeking_as_a_psychiatric_exposure.docx
            manuscript/manuscript.md
            results/
            audit/statistical_validation.json
